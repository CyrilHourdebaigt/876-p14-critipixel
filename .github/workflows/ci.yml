name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: criti-pixel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/criti-pixel?serverVersion=16&charset=utf8"

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, iconv, intl, mbstring, pgsql, pdo_pgsql
          coverage: none

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Compiler le Sass
        run: php bin/console sass:build

      - name: Créer la base de données de test
        run: php bin/console doctrine:database:create --env=test

      - name: Exécuter les migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Charger les fixtures
        run: php bin/console doctrine:fixtures:load --no-interaction --purge-with-truncate --env=test

      - name: Lancer les tests
        run: php bin/phpunit

      - name: Lancer PHPStan
        run: vendor/bin/phpstan analyse
